[project]
name = "ottobot"
version = "0.1.0"
description = "Filipino lead-to-appointment AI sales agent"
requires-python = ">=3.12"
dependencies = [
    "langgraph==0.6.11",
    "langgraph-checkpoint-postgres==2.0.25",
    "psycopg[binary,pool]>=3.2.0,<4",
    "litellm==1.83.9",
    "fastapi[standard]==0.128.8",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0,<3",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    "instructor",
    "arize-phoenix",
    "openinference-instrumentation-langchain",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx",
]

[tool.setuptools]
packages = ["agent", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
